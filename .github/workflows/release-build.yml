name: Release Build

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # 改回官方稳定版

    - name: Set up JDK 21
      uses: actions/setup-java@v4 # 改回官方稳定版
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 核心修改：改成 assembleDebug，不需要签名
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-configuration-cache --warning-mode all
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4 # 改回官方稳定版
      with:
        name: fluxhub-debug
        path: app/build/outputs/apk/debug/*.apk # 路径改成 debug
